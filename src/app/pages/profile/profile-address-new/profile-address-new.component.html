<main class="page">
  <header class="hero">
    <div class="hero-copy">
      <div class="eyebrow">Add address</div>
      <h1>New delivery address</h1>
      <p class="subline">Add a new location for faster checkout.</p>
    </div>
    <div class="hero-actions">
      <button mat-stroked-button routerLink="/profile">Back to profile</button>
    </div>
  </header>

  <mat-card class="card error" *ngIf="errorMessage">
    <div class="state">
      <mat-icon>error_outline</mat-icon>
      <span>{{ errorMessage }}</span>
    </div>
  </mat-card>

  <mat-card class="card success" *ngIf="successMessage">
    <div class="state">
      <mat-icon>check_circle</mat-icon>
      <span>{{ successMessage }}</span>
    </div>
  </mat-card>

  <mat-card class="card">
    <div class="card-title">Address details</div>
    <mat-divider></mat-divider>
    <form class="field-grid" [formGroup]="form">
      <mat-form-field appearance="outline" class="field">
        <mat-label>Title</mat-label>
        <input matInput formControlName="Title" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="field">
        <mat-label>Address</mat-label>
        <textarea matInput formControlName="Address" rows="3"></textarea>
      </mat-form-field>
    </form>
    <div class="card-actions">
      <button
        mat-raised-button
        color="primary"
        type="button"
        [disabled]="form.invalid || saving"
        (click)="saveAddress()"
      >
        {{ saving ? 'Saving...' : 'Save address' }}
      </button>
    </div>
  </mat-card>
</main>
