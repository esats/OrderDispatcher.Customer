<main class="page">
  <header class="hero">
    <div>
      <div class="eyebrow">OrderDispatch Customer</div>
      <h1>Stores</h1>
      <p class="subline">Choose your favorite store, start your order.</p>
    </div>
    <div class="hero-actions">
      <button mat-stroked-button routerLink="/profile">Profile</button>
      <button mat-raised-button color="primary">Order now</button>
    </div>
  </header>

  <section class="store-grid">
    <mat-card class="store-card" *ngFor="let store of stores">
      <div class="store-header">
        <div class="store-icon" *ngIf="!store.imageUrls?.length">{{ getInitials(store) }}</div>
        <img
          class="store-image"
          *ngIf="store.imageUrls?.length"
          [src]="store.imageUrls?.[0]"
          [alt]="getStoreName(store)"
        />
        <div class="store-copy">
          <div class="store-name">{{ getStoreName(store) }}</div>
          <div class="store-meta">{{ store.email || 'No email listed' }}</div>
        </div>
        <button
          class="store-badge"
          *ngIf="getBasketCount(store) > 0"
          type="button"
          (click)="placeOrder(store)"
        >
          <mat-icon>shopping_basket</mat-icon>
          <span>{{ getBasketCount(store) }}</span>
        </button>
      </div>
      <mat-divider></mat-divider>
      <div class="store-body">
        <div class="store-info">
          <mat-icon>call</mat-icon>
          <span>{{ store.phoneNumber || 'Phone unavailable' }}</span>
        </div>
        <div class="store-info">
          <mat-icon>mail</mat-icon>
          <span>{{ store.email || 'Email unavailable' }}</span>
        </div>
      </div>
      <div class="store-actions">
        <button
          mat-raised-button
          color="primary"
          (click)="placeOrder(store)"
          [disabled]="!getStoreId(store)"
        >
          Place order
        </button>
      </div>
    </mat-card>
  </section>
</main>
