<main class="page">
  <header class="hero">
    <div>
      <div class="eyebrow">OrderDispatch Customer</div>
      <h1>Stores</h1>
      <p class="subline">Choose your favorite store, start your order.</p>
    </div>
    <div class="hero-actions">
      <button mat-stroked-button routerLink="/profile">Profile</button>
      <button mat-raised-button color="primary">Order now</button>
    </div>
  </header>

  <section class="store-grid">
    <mat-card class="store-card" *ngFor="let store of stores">
      <div class="store-header">
        <div class="store-icon">{{ store.short }}</div>
        <div class="store-copy">
          <div class="store-name">{{ store.name }}</div>
          <div class="store-meta">{{ store.meta }}</div>
        </div>
        <mat-chip-set class="store-chips">
          <mat-chip *ngFor="let tag of store.tags">{{ tag }}</mat-chip>
        </mat-chip-set>
      </div>
      <mat-divider></mat-divider>
      <div class="store-body">
        <div class="store-info">
          <mat-icon>schedule</mat-icon>
          <span>{{ store.delivery }}</span>
        </div>
        <div class="store-info">
          <mat-icon>place</mat-icon>
          <span>{{ store.distance }}</span>
        </div>
        <div class="store-info">
          <mat-icon>star</mat-icon>
          <span>{{ store.rating }}</span>
        </div>
      </div>
      <div class="store-actions">
        <button mat-stroked-button>Store details</button>
        <button mat-raised-button color="primary" routerLink="/products">Place order</button>
      </div>
    </mat-card>
  </section>
</main>
